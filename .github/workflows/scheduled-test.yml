name: 商家自动化定时测试

on:
  schedule:
    # 北京时间每天早上8点执行（UTC 0:00）
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行商家创建与编辑测试
        env:
          CI: 'true'
        run: python test_create_business_tree_select.py

      - name: 上传测试截图（用于调试）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: '*.png'
          retention-days: 7
